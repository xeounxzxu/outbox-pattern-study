spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/outbox}
    username: ${DB_USERNAME:outbox}
    password: ${DB_PASSWORD:outbox}
  flyway:
    locations: classpath:db/migration
outbox:
  processor-enabled: ${OUTBOX_PROCESSOR_ENABLED:true}
  processing-interval: ${OUTBOX_PROCESSING_INTERVAL:200ms}
  lock-timeout: ${OUTBOX_LOCK_TIMEOUT:5s}
  # Stable across API and Worker; consumers deduplicate using source + sequence.
  event-source: ${OUTBOX_EVENT_SOURCE:outbox-pattern}
  producer:
    "[bootstrap.servers]": ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    "[delivery.timeout.ms]": "10000"
    "[request.timeout.ms]": "3000"
    "[max.block.ms]": "3000"
